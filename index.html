        :root{
          --bg: #0a1913;
          --bg-2: #10261d;
          --card: #132e22;
          --card-2: #173728;
          --gold: #c9a24b;
          --gold-2: #e7c77a;
          --text: #e8e6e1;
          --muted: #a8a39a;
          --muted-2: #6e6b66;
          --line: rgba(201,162,75,0.18);
          --line-2: rgba(201,162,75,0.32);
          --focus: #c9a24b;
          --radius: 18px;
          --radius-lg: 26px;
          --safe-top: env(safe-area-inset-top, 0px);
        }
        html,body{max-width:100%; overflow-x:hidden}
        *,*::before,*::after{box-sizing:border-box; min-width:0; max-width:100%}
        html{scroll-behavior:smooth; scroll-padding-top: 88px; overflow-x:hidden}
        body{margin:0; background:var(--bg); color:var(--text); font-family: "Inter", system-ui, -apple-system, Segoe UI, Roboto, "Helvetica Neue", Arial, sans-serif; -webkit-text-size-adjust:100%; text-size-adjust:100%; line-height:1.6; -webkit-font-smoothing:antialiased; overflow-x:hidden; width:100%}
        img, video, iframe{max-width:100%; display:block; height:auto}
        pre, code, .code-body{max-width:100%; overflow-wrap:break-word; word-break:break-word; white-space:pre-wrap}
        a{color:inherit; text-decoration:none}
        a:focus-visible, button:focus-visible{outline:2px solid var(--focus); outline-offset:3px; border-radius:8px}
        .skip{position:absolute; left:-9999px; top:0; background:var(--gold); color:#0a1913; padding:12px 18px; z-index:9999; border-radius:10px; font-weight:700}
        .skip:focus{left:12px; top:calc(var(--safe-top) + 12px)}
        .wrap{max-width:1180px; margin:0 auto; padding:0 20px}
        @media(min-width:900px){ .wrap{padding:0 32px} }
        .wrap, .section, .projects, .p-card, .infra-wrap, .code-window, .hero, .nav, .footer, .hero-grid, .sobre-grid, .contact-grid, .tech-grid, .infra-grid, .prints, .p-body, .nav-inner, .bullet, .contact-card, .contact-list, .contact-item, .p-links, .stack, .hero-actions, .hero-meta{max-width:100%; min-width:0; overflow-wrap:break-word; word-break:break-word}
        .wrap{width:100%; overflow-x:clip}
        .code-window{overflow:hidden; width:100%; max-width:100%}
        .gold-glow{max-width:100%; overflow:hidden; pointer-events:none}
        .p-title, .p-title a, .section-title, .h1{word-break:break-word; overflow-wrap:anywhere}
        .banner-link{white-space:normal; text-align:center; line-height:1.3; display:inline-block; max-width:100%; word-break:break-word; overflow-wrap:anywhere}
        /* NAV */
        .nav{position:sticky; top:0; z-index:50; padding-top:var(--safe-top); backdrop-filter: blur(18px) saturate(1.2); -webkit-backdrop-filter: blur(18px) saturate(1.2); background: linear-gradient(to bottom, rgba(10,25,19,0.92), rgba(10,25,19,0.78)); border-bottom:1px solid var(--line); width:100%; max-width:100%; overflow-x:clip}
        .nav-inner{display:flex; align-items:center; justify-content:space-between; height:68px}
        .brand{display:flex; align-items:center; gap:12px; min-width:0; font-weight:800; letter-spacing:-0.02em}
        .brand-mark{width:36px; height:36px; border-radius:10px; background: linear-gradient(145deg, var(--gold), var(--gold-2)); color:#0a1913; display:grid; place-items:center; font-weight:900; font-size:15px}
        .brand span{font-size:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0}
        .brand-mark{flex:0 0 auto}
        .nav-links{display:none; gap:28px; align-items:center}
        @media(min-width:900px){ .nav-links{display:flex} }
        .nav-links a{font-size:14px; color:var(--muted); font-weight:500; letter-spacing:0.01em; position:relative; padding:8px 0}
        .nav-links a:hover,.nav-links a[aria-current="page"]{color:var(--text)}
        .nav-links a::after{content:""; position:absolute; left:0; bottom:0; width:0; height:1px; background:var(--gold); transition:width .25s}
        .nav-links a:hover::after{width:100%}
        .btn.nav-cta{display:none}
        @media(min-width:900px){ .btn.nav-cta{display:inline-flex} }
        .btn{border-radius:999px; min-height:44px; padding:12px 22px; font-weight:700; font-size:14.5px; letter-spacing:0.01em; display:inline-flex; align-items:center; justify-content:center; gap:8px; border:1px solid transparent; transition:all .22s ease; cursor:pointer; white-space:nowrap; max-width:100%; flex-wrap:wrap}
        .btn-primary{background:var(--gold); color:#0a1913; border-color:var(--gold)}
        .btn-primary:hover{background:var(--gold-2); transform:translateY(-1px); box-shadow:0 8px 24px rgba(201,162,75,0.24)}
        .btn-ghost{background:rgba(255,255,255,0.04); color:var(--text); border-color:var(--line)}
        .btn-ghost:hover{background:rgba(255,255,255,0.08); border-color:var(--line-2)}
        .burger{display:inline-flex; width:44px; height:44px; border-radius:12px; border:1px solid var(--line); background:rgba(255,255,255,0.03); align-items:center; justify-content:center; cursor:pointer}
        @media(min-width:900px){ .burger{display:none} }
